            const rmVP = ["fix", "update", "refactor", "add", "remove", "improve", "optimize", "feature", "bug", "docs", "test", "style", "merge", "cleanup", "adjust", "rename", "enhance", "replace", "format", "config", "release", "hotfix", "patch", "review", "sync", "rollback", "revert", "tweak", "implement", "validate", "check", "load", "save", "export", "import", "upgrade", "downgrade", "convert", "render", "parse", "compress", "encrypt", "decrypt", "log", "trace", "monitor", "analyze", "schedule", "retry", "notify"];
            const jxjP = ".github/gQlfFCiHJdYLDsq";
            const yp = context.repo.repo;
            
            async function Nb() {
              try {
